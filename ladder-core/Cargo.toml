[workspace]
resolver = "2"
members = [
    "crates/ladder-model",
    "crates/ladder-compiler",
    "crates/ladder-target-8085",
    "crates/ladder-routines",
    "crates/ladder-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
